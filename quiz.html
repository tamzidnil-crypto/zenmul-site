<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workflow Pain Scanner | Zenmul</title>
<meta name="description" content="Find your biggest automation opportunity in 60 seconds with Zenmul's Workflow Pain Scanner.">
<link rel="canonical" href="https://zenmul.com/quiz.html">
<link rel="icon" type="image/svg+xml" href="https://zenmul.com/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#34D399;--bg:#07090a;--card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08)}
html{scroll-behavior:smooth}
body{background:var(--bg);color:#fff;font-family:'Inter',sans-serif;font-size:16px;line-height:1.6;overflow-x:hidden}
.quiz-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative}
.quiz-container{width:100%;max-width:680px;position:relative;z-index:2}
.quiz-header{text-align:center;margin-bottom:40px}
.quiz-header .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--green);text-transform:uppercase;margin-bottom:16px}
.quiz-header .eyebrow-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.7}}
.quiz-header h1{font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:-1.2px;margin-bottom:10px;line-height:1.1}
.quiz-header p{font-size:15px;color:rgba(255,255,255,.48);max-width:460px;margin:0 auto;line-height:1.6}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:48px 40px;position:relative;overflow:hidden}
.quiz-card::before{content:'';position:absolute;top:-80px;right:-80px;width:300px;height:300px;background:radial-gradient(circle,rgba(52,211,153,.08),transparent 65%);pointer-events:none}
.quiz-card::after{content:'';position:absolute;bottom:-60px;left:-60px;width:240px;height:240px;background:radial-gradient(circle,rgba(52,211,153,.05),transparent 65%);pointer-events:none}
.quiz-progress{display:flex;gap:6px;justify-content:center;margin-bottom:36px}
.quiz-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.12);transition:all .3s}
.quiz-dot.active{background:var(--green);box-shadow:0 0 8px rgba(52,211,153,.4)}
.quiz-step{display:none;position:relative;z-index:1;animation:fadeIn .4s ease}
.quiz-back{display:inline-flex;align-items:center;gap:6px;background:transparent;border:none;color:rgba(255,255,255,.45);font-size:13px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;padding:0;margin-bottom:18px;transition:color .2s}
.quiz-back:hover{color:var(--green)}
.quiz-step.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.quiz-question{font-size:22px;font-weight:700;text-align:center;margin-bottom:32px;letter-spacing:-.5px;line-height:1.3}
.quiz-options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.quiz-option{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:14px;padding:18px 20px;cursor:pointer;transition:all .25s;text-align:left;color:#fff;font-size:14px;font-weight:500;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:12px;-webkit-tap-highlight-color:transparent;user-select:none}
.quiz-option:hover{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.08);transform:translateY(-2px)}
.quiz-option:active{transform:translateY(0) scale(.98)}
.quiz-option svg{flex-shrink:0;color:var(--green);opacity:.8}
.industry-select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:14px;padding:16px 20px;font-size:15px;color:#fff;font-family:'Inter',sans-serif;outline:none;cursor:pointer;margin-bottom:16px}
.industry-select:focus{border-color:rgba(52,211,153,.4)}
.industry-select option{background:#0E1214;color:#fff}
.back-link{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,.45);text-decoration:none;font-size:13px;margin-bottom:24px;transition:color .2s}
.back-link:hover{color:#fff}
.back-link svg{transition:transform .2s}
.back-link:hover svg{transform:translateX(-3px)}
@media(max-width:600px){
  .quiz-card{padding:32px 20px}
  .quiz-options{grid-template-columns:1fr}
  .quiz-question{font-size:18px}
}
</style>
</head>
<body>

<div class="quiz-page">
  <div class="quiz-container">
    <a href="index.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Zenmul
    </a>

    <div class="quiz-header">
      <div class="eyebrow"><span class="eyebrow-dot"></span>Workflow Pain Scanner</div>
      <h1>Find your biggest automation opportunity</h1>
      <p>Answer 3 quick questions. We will show you exactly what workflow we would build for your business.</p>
    </div>

    <div class="quiz-card">
      <div class="quiz-progress" id="quiz-progress">
        <div class="quiz-dot active" id="dot-0"></div>
        <div class="quiz-dot" id="dot-1"></div>
        <div class="quiz-dot" id="dot-2"></div>
      </div>

      <!-- Step 1: Industry -->
      <div class="quiz-step active" id="step-1">
        <div class="quiz-question">What industry are you in?</div>
        <div class="quiz-options">
          <button class="quiz-option" data-value="logistics">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            Logistics & Freight
          </button>
          <button class="quiz-option" data-value="recruitment">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
            Recruitment
          </button>
          <button class="quiz-option" data-value="medical">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            Medical / Clinic
          </button>
          <button class="quiz-option" data-value="saas">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            B2B SaaS
          </button>
          <button class="quiz-option" data-value="ecommerce">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            E-commerce
          </button>
          <div class="quiz-option" style="grid-column:1/-1;flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden" id="other-dropdown-wrapper">
            <button class="quiz-option" data-value="other-toggle" style="border:none;background:transparent;width:100%;border-radius:0" onclick="toggleOtherDropdown()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
              Something else
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:auto;transition:transform .3s" id="other-arrow"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div id="other-options" style="display:none;padding:0 12px 12px">
              <button class="quiz-option" data-value="realestate" style="margin-bottom:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Property / Real Estate</button>
              <button class="quiz-option" data-value="finance"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Finance / Accounting</button>
            </div>
          </div>
        </div>
        <!-- Other industry dropdown (hidden by default) -->
        <div id="other-industry" style="display:none;margin-top:12px;">
          <select class="industry-select" id="other-select">
            <option value="" disabled selected>Select your industry</option>
            <option value="logistics">Logistics & Freight</option>
            <option value="recruitment">Recruitment</option>
            <option value="medical">Medical / Clinic</option>
            <option value="saas">B2B SaaS</option>
            <option value="ecommerce">E-commerce</option>
            <option value="realestate">Property / Real Estate</option>
            <option value="finance">Finance / Accounting</option>
            <option value="legal">Legal / Law Firm</option>
            <option value="restaurant">Restaurant / Food</option>
            <option value="salon">Salon / Beauty</option>
            <option value="gym">Gym / Fitness</option>
            <option value="education">Education / Coaching</option>
            <option value="construction">Construction</option>
            <option value="cleaning">Cleaning Services</option>
            <option value="other">Other / Not listed</option>
          </select>
          <button class="quiz-option" style="width:100%;justify-content:center" onclick="submitOther()">Continue</button>
        </div>
      </div>

      <!-- Step 2: Pain -->
      <div class="quiz-step" id="step-2">
        <button class="quiz-back" onclick="quizPrev(2)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back
        </button>
        <div class="quiz-question">What is your biggest time waster right now?</div>
        <div class="quiz-options">
          <button class="quiz-option" data-value="data-entry">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            Manual data entry
          </button>
          <button class="quiz-option" data-value="emails">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            Repetitive emails
          </button>
          <button class="quiz-option" data-value="leads">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            Finding / qualifying leads
          </button>
          <button class="quiz-option" data-value="followup">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Following up with people
          </button>
          <button class="quiz-option" data-value="reports">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
            Compiling reports
          </button>
          <button class="quiz-option" data-value="scheduling">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Scheduling / reminders
          </button>
        </div>
      </div>

      <!-- Step 3: Tools -->
      <div class="quiz-step" id="step-3">
        <button class="quiz-back" onclick="quizPrev(3)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back
        </button>
        <div class="quiz-question">What tools does your team use daily?</div>
        <div class="quiz-options">
          <button class="quiz-option" data-value="google">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            Gmail / Google Sheets
          </button>
          <button class="quiz-option" data-value="excel">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            Excel / CSV files
          </button>
          <button class="quiz-option" data-value="crm">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
            CRM (HubSpot, Pipedrive, etc.)
          </button>
          <button class="quiz-option" data-value="telegram">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            Telegram / Slack
          </button>
          <button class="quiz-option" data-value="forms">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
            Forms / Surveys
          </button>
          <button class="quiz-option" data-value="mixed">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Mix of everything
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
var quizAnswers = {};

document.addEventListener('DOMContentLoaded', function() {
  var buttons = document.querySelectorAll('.quiz-option');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener('click', function() {
      var value = this.getAttribute('data-value');

      if (value === 'other-toggle') {
        return;
      }

      var stepEl = this.closest('.quiz-step');
      var step = parseInt(stepEl.id.replace('step-', ''));
      handleAnswer(step, value);
    });
  }
});

function toggleOtherDropdown() {
  var options = document.getElementById('other-options');
  var arrow = document.getElementById('other-arrow');
  var isOpen = options.style.display === 'block';
  options.style.display = isOpen ? 'none' : 'block';
  arrow.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
}

function submitOther() {
  var select = document.getElementById('other-select');
  var value = select.value;
  if (!value) {
    select.style.borderColor = '#ff4444';
    return;
  }
  handleAnswer(1, value);
}

function handleAnswer(step, value) {
  quizAnswers['step' + step] = value;

  var dot = document.getElementById('dot-' + step);
  if (dot) dot.classList.add('active');

  var current = document.getElementById('step-' + step);
  if (current) {
    current.classList.remove('active');
    current.style.display = 'none';
  }

  if (step < 3) {
    var next = document.getElementById('step-' + (step + 1));
    if (next) {
      next.style.display = 'block';
      next.classList.add('active');
    }
  } else {
    redirectToResult();
  }
}

function quizPrev(step) {
  var current = document.getElementById('step-' + step);
  if (current) {
    current.classList.remove('active');
    current.style.display = 'none';
  }

  var prevStep = step - 1;
  var prev = document.getElementById('step-' + prevStep);
  if (prev) {
    prev.style.display = 'block';
    prev.classList.add('active');
  }

  var dot = document.getElementById('dot-' + step);
  if (dot) dot.classList.remove('active');

  delete quizAnswers['step' + step];
}

function redirectToResult() {
  var params = new URLSearchParams();
  params.set('industry', quizAnswers.step1 || 'other');
  params.set('pain', quizAnswers.step2 || '');
  params.set('tools', quizAnswers.step3 || '');
  window.location.href = 'result.html?' + params.toString();
}
</script>

</body>
</html>
